version: '3.8'

services:
  db-buah:
    image: postgres:15-alpine
    container_name: gudangbuah-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vocpos2026
      POSTGRES_DB: gudangBuah
    volumes:
      - gudangbuah_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gudangBuah"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  gudangbuah_db_data:
